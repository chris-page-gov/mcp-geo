name: GitHub Pages

on:
  push:
    branches:
      - main
      # Keep the discussion branch deployable before the work package is merged.
      - codex/os-okf-pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build deterministic public site
        run: python scripts/build_okf_discovery_pages.py --output-dir _site

      - name: Check deterministic rebuild
        run: python scripts/build_okf_discovery_pages.py --output-dir _site --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/codex/os-okf-pages'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
