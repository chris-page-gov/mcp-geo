<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Postcodes around CV3 1HB</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; }
    #header {
      background: #1a3d2b;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    #header h1 { font-size: 18px; font-weight: 600; }
    #header p  { font-size: 12px; opacity: 0.75; margin-top: 2px; }
    #map { height: calc(100vh - 56px); width: 100%; }
    .legend {
      background: white;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.7;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .legend-dot {
      display: inline-block;
      width: 12px; height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .postcode-popup h3 { font-size: 14px; margin-bottom: 4px; }
    .postcode-popup p  { font-size: 12px; color: #555; }
    #status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.72);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
      transition: opacity .3s;
    }
    #status.hidden { opacity: 0; }
  </style>
</head>
<body>

<div id="header">
  <div>
    <h1>Postcodes around CV3 1HB</h1>
    <p>Binley Road, Coventry · click any marker for postcode details</p>
  </div>
</div>

<div id="map"></div>
<div id="status">Loading nearby postcodes…</div>

<script>
const FOCUS = { lat: 52.4063, lng: -1.4754, postcode: 'CV3 1HB' };

// ── Map setup ───────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [FOCUS.lat, FOCUS.lng],
  zoom: 14,
  zoomControl: true
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

// ── Focus marker ─────────────────────────────────────────────────────────────
const focusIcon = L.divIcon({
  className: '',
  html: `<div style="
    background:#c44a00;
    color:white;
    font-weight:700;
    font-size:11px;
    padding:5px 9px;
    border-radius:20px;
    white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,.35);
    border:2px solid white;
  ">${FOCUS.postcode}</div>`,
  iconAnchor: [36, 14]
});

L.marker([FOCUS.lat, FOCUS.lng], { icon: focusIcon })
  .addTo(map)
  .bindPopup(`
    <div class="postcode-popup">
      <h3>${FOCUS.postcode}</h3>
      <p>Binley Road, Coventry</p>
      <p>Ward: Lower Stoke</p>
      <p>LAD: Coventry (E08000026)</p>
      <p>MSOA: Coventry 027</p>
    </div>
  `, { maxWidth: 220 });

// ── Nearby postcodes from postcodes.io ───────────────────────────────────────
const statusEl = document.getElementById('status');

function postcodeColor(pc) {
  // Colour by postcode sector (e.g. CV3 1, CV3 2 …)
  const sector = pc.replace(/\s+/g, '').replace(/[A-Z]+$/, '');
  const palette = [
    '#2563eb','#16a34a','#9333ea','#0891b2','#b45309',
    '#be123c','#0f766e','#7c3aed','#1d4ed8','#15803d'
  ];
  let hash = 0;
  for (const c of sector) hash = (hash * 31 + c.charCodeAt(0)) & 0xffff;
  return palette[hash % palette.length];
}

async function loadNearby() {
  try {
    const url = `https://api.postcodes.io/postcodes?lon=${FOCUS.lng}&lat=${FOCUS.lat}&radius=1200&limit=100`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.result) throw new Error('No results');

    const seen = new Set();
    let count = 0;

    for (const item of data.result) {
      const pc = item.postcode;
      if (seen.has(pc) || pc === FOCUS.postcode.replace(/\s/g,'')) continue;
      seen.add(pc);

      const colour = postcodeColor(pc);
      const marker = L.circleMarker([item.latitude, item.longitude], {
        radius: 7,
        fillColor: colour,
        color: 'white',
        weight: 1.5,
        fillOpacity: 0.85
      }).addTo(map);

      marker.bindPopup(`
        <div class="postcode-popup">
          <h3>${pc}</h3>
          <p>${item.admin_ward || ''}</p>
          <p>Country: ${item.country || 'England'}</p>
          <p>Lat ${item.latitude.toFixed(5)}, Lon ${item.longitude.toFixed(5)}</p>
        </div>
      `, { maxWidth: 200 });

      count++;
    }

    statusEl.textContent = `${count} nearby postcodes loaded`;
    setTimeout(() => statusEl.classList.add('hidden'), 2500);

    // ── Legend ───────────────────────────────────────────────────────────────
    const sectors = [...new Set([...seen].map(pc => {
      const m = pc.match(/^([A-Z]+\d+\s*\d)/);
      return m ? m[1] : pc.slice(0, 4);
    }))].slice(0, 8);

    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = () => {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = '<strong style="font-size:13px">Postcode sectors</strong><br/>';
      sectors.forEach(s => {
        const c = postcodeColor(s + 'AA');
        div.innerHTML += `<span class="legend-dot" style="background:${c}"></span>${s}×<br/>`;
      });
      div.innerHTML += `<br/><span class="legend-dot" style="background:#c44a00"></span>CV3 1HB (focus)`;
      return div;
    };
    legend.addTo(map);

  } catch (err) {
    statusEl.textContent = 'Could not load postcodes: ' + err.message;
    setTimeout(() => statusEl.classList.add('hidden'), 4000);
  }
}

loadNearby();
</script>
</body>
</html>
